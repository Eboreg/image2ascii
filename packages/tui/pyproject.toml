[project]
name = "image2ascii-tui"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Robert Huselius", email = "robert@huseli.us" }
]
requires-python = ">=3.13"
dependencies = [
    "image2ascii",
    "textual>=8.2.4",
]

[project.entry-points.i2a_plugins]
